name: Build and distribute Codex
on:
  push:
    branches: [main]
    paths: ['release-request.json']
  workflow_dispatch:
    inputs:
      version:
        description: Product version (matches sources)
        required: true
        default: '5.97'
      code:
        description: Monotonically increasing update code
        required: true
        default: '215'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: codex-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve release request
        id: release
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_CODE: ${{ inputs.code }}
        run: |
          python3 - <<'PY'
          import os, json, re
          if os.environ.get('GITHUB_EVENT_NAME') == 'push':
              request = json.load(open('release-request.json'))
              version, code = str(request['version']), str(request['code'])
          else:
              version, code = os.environ['MANUAL_VERSION'], os.environ['MANUAL_CODE']
          assert re.fullmatch(r'[0-9]+\.[0-9]+(?:\.[0-9]+)?', version)
          assert re.fullmatch(r'[0-9]+', code) and int(code) >= 213
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={version}\ncode={code}\n')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate Android asset allowlist before packaging
        run: |
          python3 project/android-codice/tools/check_asset_access.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('project/android-codice')
          source = (root/'src/br/com/codice/aventureiro/MainActivity.java').read_text()
          allowed = set(re.findall(r'"(/[^"\s]+)"', source.split('Arrays.asList(',1)[1].split(');',1)[0]))
          actual = {'/'+p.name for p in (root/'assets').iterdir() if p.is_file()}
          assert actual == allowed, f'Extra: {actual-allowed}; missing: {allowed-actual}'
          print('Exact match with installed native updater allowlist.')
          PY
      - name: Build signed APK and signed asset bundle
        env:
          BACKUP: ${{ secrets.CODEX_SIGNING_BACKUP_JSON }}
          MANIFEST: ${{ vars.CODEX_UPDATE_MANIFEST_URL }}
          VERSION: ${{ steps.release.outputs.version }}
          CODE: ${{ steps.release.outputs.code }}
        run: |
          set -euo pipefail
          test -n "$BACKUP"; test -n "$MANIFEST"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; [[ "$CODE" =~ ^[0-9]+$ ]]
          umask 077
          KEY=$(mktemp); trap 'rm -f "$KEY"' EXIT
          printf '%s' "$BACKUP" > "$KEY"
          mkdir -p release
          if [[ "$CODE" == 218 && "$VERSION" == 5.99 ]]; then
            python3 tools/build-native595.py --sdk "$ANDROID_HOME" --signing-backup "$KEY" --manifest-url "$MANIFEST" --output release
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/codex-${CODE}/codex-assets-${CODE}.zip"
          python3 tools/package-update595.py --signing-backup "$KEY" --output release --url "$URL" --version "$VERSION" --code "$CODE"
      - name: Publish release before manifest
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.release.outputs.code }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release create "codex-$CODE" release/* --title "Codex $VERSION" --notes "Codex $VERSION" --target "$GITHUB_SHA"
      - name: Stage website and manifest
        run: cp release/update-manifest.json web-source/dist/update-manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-source/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
